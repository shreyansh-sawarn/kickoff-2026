name: Build Android

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0-mobile)
  workflow_dispatch: # Enable manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve Native Build Scripts
        run: pnpm approve-builds

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android Local Artifact
        run: pnpm --filter mobile exec eas build --platform android --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: apps/mobile/*.aab
